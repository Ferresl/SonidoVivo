<main class="fondo-pagina">

        <h1 class="titulo-seccion">Contacto</h1>

        <p class="texto-contacto">
            Si tienes alguna duda o consulta, completa el siguiente formulario.
        </p>

        <form id="formContacto" class="formulario-contacto">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" class="form-control" maxlength="100">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" class="form-control" maxlength="100">

            <label for="comentario">Comentario</label>
            <textarea id="comentario" class="form-control" rows="5" maxlength="500"></textarea>

            <button type="submit" class="btn btn-primary boton-contacto">Enviar</button>

        </form>
    </section>
