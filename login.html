<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">

    <title>SonidoVivo - Iniciar Sesión</title>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="Inicio.html">SonidoVivo</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="login">

            <h1>Iniciar sesión</h1>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.cl">

            <label for="clave">Clave:</label>
            <div class="campo-clave">
                <input type="password" id="clave" placeholder="Entre 4 y 10 caracteres">
                <span onclick="mostrarClave()" id="ojito">👁</span>
            </div>

            <button class="btn btn-dark mt-3" onclick="ingresar()">Ingresar</button>

        </div>
    </main>

    <script src="JS/login.js"></script>
</body>
</html>
