<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/admin.css">

    <title>SonidoVivo - Mantenedor de Contenido</title>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">

                <a class="navbar-brand" href="admin.html">SonidoVivo Admin</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link active" href="mantenedorContenido.html">Mantenedor de Contenido</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="mantenedorUsuarios.html">Mantenedor de Usuarios</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="Inicio.html">Volver al sitio público</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="login.html">Cerrar Sesión</a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main>

        <h1>Mantenedor de Contenido</h1>

        <button class="btn btn-dark mb-3" onclick="mostrarFormularioNuevo()">Agregar Producto</button>
        <table class="table table-striped tabla-admin">
            <thead>
                <tr>
                    <th>Codigo</th>
                    <th>Nombre</th>
                    <th>Marca</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>

        <div id="formularioNuevo" class="form-editar" style="display: none;">

            <h2>Nuevo Producto</h2>
            
            <label for="nuevoCodigo">Código:</label>
    <input type="text" id="nuevoCodigo">

    <label for="nuevoNombre">Nombre:</label>
    <input type="text" id="nuevoNombre">

    <label for="nuevoMarca">Marca:</label>
    <input type="text" id="nuevoMarca">

    <label for="nuevoPrecio">Precio:</label>
    <input type="number" id="nuevoPrecio">

    <label for="nuevoStock">Stock:</label>
    <input type="number" id="nuevoStock">

    <button class="btn btn-dark mt-2" onclick="guardarNuevoProducto()">Guardar Producto</button>
    <button class="btn btn-secondary mt-2" onclick="cerrarFormularioNuevo()">Cancelar</button>     
        </div>

        <div id="formularioEditar" class="form-editar" style="display: none;">

            <h2>Editar Producto</h2>

            <label for="editNombre">Nombre:</label>
            <input type="text" id="editNombre">

            <label for="editMarca">Marca:</label>
            <input type="text" id="editMarca">

            <label for="editPrecio">Precio:</label>
            <input type="number" id="editPrecio">

            <label for="editStock">Stock:</label>
            <input type="number" id="editStock">

            <button class="btn btn-dark mt-2" onclick="guardarCambios()">Guardar Cambios</button>
            <button class="btn btn-secondary mt-2" onclick="cerrarFormulario()">Cancelar</button>

        </div>

    </main>

    <footer class="footer-admin">
        <p>SonidoVivo &copy; 2026 - Panel Administrativo</p>
    </footer>

    <script src="JS/mantenedorContenido.js"></script>
</body>
</html>
