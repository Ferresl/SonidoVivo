<head>

    <link rel="stylesheet" href="CSS/funcionalidad.css">
    <link rel="stylesheet" href="CSS/imagen.css">
    <link rel="stylesheet" href="CSS/catalogo.css">
    <link rel="stylesheet" href="CSS/carrito.css">

    <title>SonidoVivo</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary ">
            <div class="container-fluid">

                

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse " id="navbarNav">

                    <ul class="navbar-nav w-100  enlaces-menu">
                        <li class="nav-item ">
                            <a class="nav-link" href="inicio.html">Inicio</a>
                        </li>

                        <li class="nav-item ">
                            <a class="nav-link active" href="productos.html">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item ">
                            <a class="nav-link" href="inicio.html#nosotros">
                                Nosotros
                            </a>
                        </li>

                        <li class="nav-item ">
                            <a class="nav-link" href="inicio.html#contacto">
                                Contacto
                            </a>
                        </li>
                        <li class="nav-item acceso-sesion">
                            <a class="nav-link" href="inicio.html#contacto">
                                Inicia Sesion
                            </a>
                        </li>
 
                        <li class="nav-item">
                            <a class="enlace-carrito nav-link carrito" href="inicio.html#contacto">
                               <img  class="icono-carrito carrito" src="Images/Inicio/Carrito.png">
                            </a>
                        </li>

                    </ul>

                </div>

            </div>
        </nav>
    </header>

    <img class="portada-catalogo" src="Images/Banners/BannerProductosDisponibles.png"> 

    <main class="fondo-pagina">
        <section class="seccion-pagina zona-catalogo fila-contenido">

        <aside class="filtros">

            <h3>Filtros</h3>

            <h5>Categoría</h5>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Guitarras Acústicas">
                Guitarras Acústicas
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Guitarras Eléctricas">
                Guitarras Eléctricas
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Bajos Eléctricos">
                Bajos
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Baterías">
                Baterías
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Micrófonos">
                Micrófonos
            </label>

            <hr>

            <h5>Marca</h5>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Yamaha">
                Yamaha
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Fender">
                Fender
            </label>

            <label class="etiqueta-filtro">
                <input type="checkbox" value="Epiphone">
                Epiphone
            </label>

            <hr>

            <h5>Precio máximo</h5>

            <input
                type="number"
                id="precioMaximo" min="0" aria-label="Precio máximo"
                placeholder="Ej: 300000"
            >

            <button id="btnFiltrar" class="btn btn-dark mt-3">
                Filtrar
            </button>

        <button id="btnLimpiar" class="btn btn-outline-dark mt-2">Limpiar filtros</button></aside>

        <div class="resultados-catalogo">
    <div class="barra-catalogo">
        <label class="etiqueta-orden" for="ordenCatalogo">Ordenar por</label>
        <select id="ordenCatalogo" class="form-select selector-orden">
            <option value="">Orden original</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="nombre-asc">Nombre: A a Z</option>
            <option value="nombre-desc">Nombre: Z a A</option>
        </select>
    </div>
    <div id="listaProductos" class="catalogo-orden"></div>
</div>

    </section>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/productos.js"></script>
    <script src="JS/carrito.js"></script>
    <script src="JS/catalogo.js"></script>
    

</body>

</html>
